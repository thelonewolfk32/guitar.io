name: Check and package Guitar.io
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GUITARIO_OUTPUT_DIR: ${{ github.workspace }}/release/artifacts
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run services:typecheck && npm run admin:typecheck && npm run admin:build
      - run: npm run build
      - name: Check Mac updater command
        shell: bash
        run: bash -n electron/update-mac.command
      - name: Download Windows Electron runtime
        run: node node_modules/electron/install.js
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version.' }
      - run: node scripts/package-local.mjs
      - name: Test guitar deletion, encrypted sessions, beta UI and update alert
        run: node tests/v152-desktop.mjs --packaged
      - name: Test free library allowances, archive selection and score controls
        run: node tests/v160-desktop.mjs
      - name: Test complete file sync and offline access in packaged Windows apps
        run: node tests/sync-files-desktop.mjs --packaged
      - name: Test 50 GP and 49 covers with stale selection and complete metadata checkpoints
        run: node tests/v161-sync-desktop.mjs
      - name: Test packaged Windows update, skipped versions and rollback
        run: node tests/v150-updater-desktop.mjs
      - run: ./scripts/archive-windows.ps1
      - run: node scripts/fetch-mac-runtime.mjs
      - run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          python scripts/package-mac.py --asar "$env:GUITARIO_OUTPUT_DIR/Guitar-io-$version-Windows-x64/resources/app.asar"
      - run: ./scripts/export-source.ps1
      - name: Write checksums
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          Get-ChildItem -LiteralPath $env:GUITARIO_OUTPUT_DIR -Filter '*.zip' | Sort-Object Name | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding utf8 "$env:GUITARIO_OUTPUT_DIR/Guitar-io-$version-SHA256SUMS.txt"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Guitar-io-desktop-builds
          path: |
            release/artifacts/*.zip
            release/artifacts/*SHA256SUMS.txt
          retention-days: 14
  mac-updater:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: Guitar-io-desktop-builds
          path: release-assets
      - name: Test native Mac update and local signing
        run: |
          version=$(node -p "require('./package.json').version")
          node tests/mac-updater-smoke.mjs "release-assets/Guitar-io-$version-macOS-arm64.zip"
      - name: Test complete Mac LAN replication, independent hosting and offline restart
        shell: bash
        run: |
          npm ci
          version=$(node -p "require('./package.json').version")
          mkdir -p test-results/mac-lan
          ditto -x -k "release-assets/Guitar-io-$version-macOS-arm64.zip" test-results/mac-lan
          package="$PWD/test-results/mac-lan/Guitar-io-$version-macOS-arm64"
          GUITARIO_PREPARE_NO_OPEN=1 bash "$package/Prepare and open Guitar.io.command"
          GUITARIO_TEST_EXECUTABLE="$package/Guitar.io.app/Contents/MacOS/Guitar.io" node tests/sync-files-desktop.mjs --packaged
          GUITARIO_TEST_EXECUTABLE="$package/Guitar.io.app/Contents/MacOS/Guitar.io" node tests/v161-sync-desktop.mjs
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, mac-updater]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: Guitar-io-desktop-builds
          path: release-assets
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft --jq 'select(.isDraft == false)' | grep -q .; then
            echo "Release $tag is already published; preserving its existing downloads."
            exit 0
          fi
          gh release create "$tag" release-assets/* --verify-tag --title "Guitar.io ${tag#v}" --notes-file "CHANGELOG-${tag}.md" --draft
          gh release edit "$tag" --draft=false --latest
